<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a one-screen, side-view par 5. The course scrolls on a full-bleed canvas;
   a scorecard dock pins the question, the broadcast call and the sheets to the bottom of the stage. */
:root{
  --sky-top:#6DB5E4; --sky-bot:#D7EEF6; --sun:#FFF3C2; --sun-y:.24; --cloud:rgba(255,255,255,.88);
  --hill:#A6CDA6; --treeline:#5F9B69; --tree:#3F7D4E; --tree-2:#346B42; --trunk:#6B4B33;
  --fairway:#69B654; --fairway-2:#5DA849; --rough:#418A39; --green:#83D06C; --fringe:#71C15C; --tee:#77BF60;
  --soil:#7B5337; --soil-2:#4E3422; --sand:#ECD9A0; --cup:#1A120C;
  --paper:#FAFBF5; --paper-2:#EEF2E6; --ink:#15231A; --ink-2:#4B5C4F; --rule:#D3DCCD;
  --cast:#0F2418; --cast-ink:#F3F6EE; --cast-2:#A7C1AC;
  --flag:#F2C230; --tracer:#FF4A2A; --under:#C8102E; --over:#1D6A39;
  --q-perfect:#3F51D9; --q-solid:#2C9A4C; --q-ok:#C29A12; --q-mishit:#DA7020; --q-shank:#CF3A2B; --q-whiff:#87918A;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#152340; --sky-bot:#E3865A; --sun:#FFB27A; --sun-y:.80; --cloud:rgba(255,196,170,.30);
    --hill:#3A5450; --treeline:#24413A; --tree:#1E3B2F; --tree-2:#183126; --trunk:#3C2B1F;
    --fairway:#337240; --fairway-2:#2D6839; --rough:#21502B; --green:#43944F; --fringe:#3A8546; --tee:#387A44;
    --soil:#3D2B1E; --soil-2:#271B12; --sand:#BBA670; --cup:#0B0705;
    --paper:#121C16; --paper-2:#1A2820; --ink:#E7EFE4; --ink-2:#A6B6A9; --rule:#2B3A30;
    --cast:#08130D; --cast-ink:#F0F4EC; --cast-2:#8FAA95;
    --flag:#F5C842; --tracer:#FF6B3D; --under:#FF5F70; --over:#62CC88;
    --q-perfect:#7E8CFF; --q-solid:#4CC46F; --q-ok:#E2BE3A; --q-mishit:#F08C3C; --q-shank:#F2604F; --q-whiff:#9BA59E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-top:#152340; --sky-bot:#E3865A; --sun:#FFB27A; --sun-y:.80; --cloud:rgba(255,196,170,.30);
  --hill:#3A5450; --treeline:#24413A; --tree:#1E3B2F; --tree-2:#183126; --trunk:#3C2B1F;
  --fairway:#337240; --fairway-2:#2D6839; --rough:#21502B; --green:#43944F; --fringe:#3A8546; --tee:#387A44;
  --soil:#3D2B1E; --soil-2:#271B12; --sand:#BBA670; --cup:#0B0705;
  --paper:#121C16; --paper-2:#1A2820; --ink:#E7EFE4; --ink-2:#A6B6A9; --rule:#2B3A30;
  --cast:#08130D; --cast-ink:#F0F4EC; --cast-2:#8FAA95;
  --flag:#F5C842; --tracer:#FF6B3D; --under:#FF5F70; --over:#62CC88;
  --q-perfect:#7E8CFF; --q-solid:#4CC46F; --q-ok:#E2BE3A; --q-mishit:#F08C3C; --q-shank:#F2604F; --q-whiff:#9BA59E;
  color-scheme:dark;
}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.bar{position:relative;z-index:3;display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
.word{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;letter-spacing:.03em;text-transform:uppercase}
.no{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.hole{flex:1 1 280px;min-width:0;display:flex;align-items:center;gap:12px;order:3}
.hole .lbl{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.track{position:relative;flex:1;height:30px;min-width:0}
.track::before{content:"";position:absolute;left:0;right:0;top:15px;height:2px;background:var(--rule)}
.track .green{position:absolute;top:11px;height:10px;border-radius:5px;background:var(--green);opacity:.75}
.mk{position:absolute;top:16px;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);background:var(--ink)}
.mk.tee{background:var(--paper);border:2px solid var(--ink)}
.mk.dot{border:2px solid var(--paper)}
.mk.dot span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:11px;color:var(--ink-2)}
.mk.pin{width:2px;height:24px;border-radius:0;top:4px;transform:translateX(-50%);background:var(--ink)}
.mk.pin::after{content:"";position:absolute;left:2px;top:0;border-left:11px solid var(--flag);border-top:5px solid transparent;border-bottom:5px solid transparent}
.meta{display:flex;align-items:center;gap:10px;margin-left:auto;order:2}
.score{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;font-variant-numeric:tabular-nums}
.score.under{color:var(--under)} .score.over{color:var(--over)}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--paper-2);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:860px){.hole{order:2;max-width:520px}.meta{order:3;margin-left:0}}

/* ---------- stage ---------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--sky-bot)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.dock{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding-block:0 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.dock>*{pointer-events:auto;width:min(640px,100%)}

.card{border-radius:16px;box-shadow:0 14px 40px rgba(8,26,14,.28),0 2px 6px rgba(8,26,14,.12)}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.card:not([hidden]),.sheet:not([hidden]){animation:rise .32s cubic-bezier(.2,.8,.2,1)}

/* question card */
.qcard{background:var(--paper);border:1px solid var(--rule);padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cat{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center}
.lie{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lie b{color:var(--ink);font-weight:800}
.clock{position:relative;height:8px;border-radius:4px;background:var(--paper-2);overflow:hidden}
.clock-fill{position:absolute;inset:0;background:var(--q-solid);transform-origin:left center}
.clock.low .clock-fill{background:var(--q-shank)}
.qrow{display:flex;gap:14px;align-items:flex-start}
.qtext{margin:0;flex:1;min-width:0;font-weight:600;font-size:clamp(19px,2.3vw,24px);line-height:1.28;text-wrap:balance}
.secs{flex:0 0 auto;font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.clock-low .secs{color:var(--q-shank)}
.ans{display:flex;gap:10px;align-items:stretch}
.field{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;border-bottom:3px solid var(--ink);padding:0 2px 2px}
.field input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--display);font-weight:800;font-size:40px;line-height:1.1;letter-spacing:.02em;padding:2px 0;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--ink-2);opacity:.45}
.field input:focus{outline:none}
.field:focus-within{border-color:var(--q-solid)}
.unit{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.swing,.go{border:0;border-radius:12px;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.08em;text-transform:uppercase;padding:0 22px;cursor:pointer;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.swing:disabled{opacity:.35;cursor:default}
.swing:not(:disabled):active,.go:active{transform:scale(.97)}

/* broadcast call */
.cast{background:var(--cast);color:var(--cast-ink);padding:14px 18px 16px;display:grid;gap:8px;border-top:4px solid var(--flag)}
.ctop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.strike{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px 2px;border-radius:6px;color:#fff;background:var(--q-solid)}
.cmeta{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:var(--cast-2)}
.cq{margin:0;color:var(--cast-2);font-size:14px;line-height:1.35}
.cans{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.cans div{display:flex;flex-direction:column}
.cans .k{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cast-2)}
.cans b{font-family:var(--display);font-weight:900;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.cans .off{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;color:var(--cast-2);margin-top:2px}
.call{margin:0;font-style:italic;font-weight:500;font-size:16.5px}
.res{margin:0;font-weight:700;font-size:16.5px;min-height:1.45em}
.fact{margin:0;font-size:13.5px;color:var(--cast-2);line-height:1.4}
.fact b{color:var(--cast-ink);font-weight:600}
.cact{display:flex;justify-content:flex-end}
.cast .go{background:var(--flag);color:#1B1606;min-height:46px;font-size:19px}

/* sheets */
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:18px;box-shadow:0 18px 50px rgba(8,26,14,.32);
  min-height:0;max-height:calc(100% - 140px);overflow:auto;overscroll-behavior:contain;padding:20px 20px 22px;display:flex;flex-direction:column;gap:16px}
.sheet>*{flex-shrink:0}
.sheet h1,.sheet h2,.sheet h3{margin:0;text-wrap:balance}
.eyebrow{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.title{font-family:var(--display);font-weight:900;font-size:clamp(36px,9.5vw,58px);line-height:.92;text-transform:uppercase;letter-spacing:.01em}
.title span{color:var(--ink-2);font-weight:700;font-size:.55em;letter-spacing:.06em;vertical-align:.32em;margin-left:6px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.holecard{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;font-family:var(--display);text-transform:uppercase}
.holecard div{display:flex;flex-direction:column;align-items:center;padding:4px 12px;border-left:2px solid var(--ink)}
.holecard div:first-child{border-left:0}
.holecard small{font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--ink-2)}
.holecard b{font-weight:900;font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.lede{margin:0;font-size:16px;max-width:60ch}
.scale{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.scale li{display:flex;align-items:center;gap:10px;min-width:0;font-size:14px}
.pill{flex:0 0 auto;display:inline-block;min-width:72px;text-align:center;font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px 2px;border-radius:6px;color:#fff}
.q-perfect{background:var(--q-perfect)} .q-solid{background:var(--q-solid)} .q-ok{background:var(--q-ok)}
.q-mishit{background:var(--q-mishit)} .q-shank{background:var(--q-shank)} .q-whiff{background:var(--q-whiff)}
.small{margin:0;font-size:13.5px;color:var(--ink-2);max-width:62ch}
.go.big{align-self:flex-start;min-height:56px;font-size:24px;padding:0 30px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.ghost{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:12px;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;padding:0 16px;min-height:46px;cursor:pointer}

/* final scorecard */
.result{display:flex;align-items:center;gap:18px}
.mark{flex:0 0 auto;width:78px;height:78px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.mark.u1{border:3px solid var(--under);border-radius:50%;color:var(--under)}
.mark.u2,.mark.u3{border:3px solid var(--under);border-radius:50%;color:var(--under);box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--under)}
.mark.e{border:3px solid transparent;color:var(--ink)}
.mark.o1{border:3px solid var(--over);color:var(--over)}
.mark.o2,.mark.o3{border:3px solid var(--over);color:var(--over);box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--over)}
.rname{font-family:var(--display);font-weight:900;font-size:clamp(34px,6vw,46px);line-height:.95;text-transform:uppercase}
.rsub{font-size:14.5px;color:var(--ink-2);margin-top:4px}
.rsub b{color:var(--ink)}
.rows{border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.rhead{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:6px 12px;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:10px 12px;border-top:1px solid var(--rule);align-items:start}
.row:first-of-type{border-top:0}
.rn{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.rq{font-size:13.5px;line-height:1.35;color:var(--ink-2);min-width:0}
.rv{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.03em;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.rv i{font-style:normal;color:var(--ink-2);font-weight:700}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.rmeta{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:2px}
.rr small{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.share{display:grid;gap:10px}
.share pre{margin:0;padding:12px 14px;border-radius:10px;background:var(--paper-2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-x:auto}
.share textarea{width:100%;min-height:150px;border-radius:10px;border:1px solid var(--rule);background:var(--paper-2);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.sect{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--rule)}
.sect h3{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;align-items:flex-start}
.stat b{font-family:var(--display);font-weight:900;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--ink-2);line-height:1.25}
.dist{display:grid;gap:5px}
.dr{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.dr span{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.db{height:20px;border-radius:4px;background:var(--paper-2);position:relative}
.db i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ink-2);min-width:22px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-style:normal;font-family:var(--display);font-weight:800;font-size:13px;color:var(--paper)}
.dr.me span{color:var(--ink)} .dr.me .db i{background:var(--q-solid)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.next{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.next b{color:var(--ink);font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;z-index:5;pointer-events:none;transition:opacity .25s}

.stick{position:sticky;bottom:-22px;margin:0 -20px -22px;padding:14px 20px 22px;background:linear-gradient(to bottom,transparent,var(--paper) 35%)}

/* difficulty, scorecard */
.lvl{display:inline-flex;align-items:center;gap:8px}
.diffp{display:inline-block;font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px 1px;border-radius:5px;color:#fff;vertical-align:.1em}
.d-E{background:var(--q-solid)} .d-M{background:var(--q-ok)} .d-H{background:var(--q-shank)}
.why{font-size:13px;color:var(--ink-2);font-style:italic}
.scwrap{overflow-x:auto}
.scard{width:100%;border-collapse:collapse;font-family:var(--display);text-transform:uppercase;font-variant-numeric:tabular-nums}
.scard th,.scard td{border:1.5px solid var(--ink);padding:5px 6px;text-align:center;font-weight:800;font-size:18px;line-height:1.1}
.scard th{background:var(--ink);color:var(--paper);font-size:14px;letter-spacing:.1em}
.scard td:first-child,.scard th:first-child{text-align:left;font-size:13px;letter-spacing:.12em;padding-left:10px;width:24%}
.scard td:first-child{color:var(--ink-2)}
.scard tr.you td{font-size:20px}
.sm{display:inline-grid;place-items:center;width:30px;height:30px}
.sm.u1{border:2px solid var(--under);border-radius:50%;color:var(--under)}

<script src="config.js"></script>
<script>
(() => {
'use strict';

/* =========================================================
   Constants and helpers
   ========================================================= */
const TIME = 20;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t*t*t;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const ordinal = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

/* =========================================================
   The course: three holes, par 12
   ========================================================= */
const COURSE = [
  {n:1, par:5, len:545, pin:545, green:[522,568], bunkers:[[228,244],[500,516]],
   surf:[[-1e4,-12,'rough'],[-12,10,'tee'],[10,28,'rough'],[28,228,'fw'],[228,244,'sand'],[244,500,'fw'],[500,516,'sand'],[516,522,'fringe'],[522,568,'green'],[568,574,'fringe'],[574,1e4,'rough']]},
  {n:2, par:4, len:410, pin:410, green:[386,434], bunkers:[[240,256],[366,380]],
   surf:[[-1e4,-12,'rough'],[-12,10,'tee'],[10,30,'rough'],[30,240,'fw'],[240,256,'sand'],[256,366,'fw'],[366,380,'sand'],[380,386,'fringe'],[386,434,'green'],[434,440,'fringe'],[440,1e4,'rough']]},
  {n:3, par:3, len:175, pin:175, green:[158,192], bunkers:[[140,152]],
   surf:[[-1e4,-12,'rough'],[-12,10,'tee'],[10,112,'rough'],[112,140,'fw'],[140,152,'sand'],[152,158,'fringe'],[158,192,'green'],[192,198,'fringe'],[198,1e4,'rough']]}
];
let C = COURSE[0];
const COURSE_PAR = COURSE.reduce((a, h) => a + h.par, 0), COURSE_LEN = COURSE.reduce((a, h) => a + h.len, 0);

/* =========================================================
   Strike quality and the golf model
   ========================================================= */
const QNAME = {perfect:'Perfect', solid:'Solid', ok:'OK', mishit:'Mishit', shank:'Shank', whiff:'Whiff'};
const QEMO = {perfect:'🎯', solid:'🟩', ok:'🟨', mishit:'🟧', shank:'🟥', whiff:'⬜'};
function bands(it){
  if (it.t === 'y'){ const a = it.a; if (a < 1000) return [10,30,75,150]; if (a < 1700) return [5,15,35,75]; return [2,5,12,25]; }
  const a = Math.abs(it.a);
  return [Math.max(1, Math.round(a*.04)), Math.max(2, Math.round(a*.10)), Math.max(3, Math.round(a*.25)), Math.max(5, Math.round(a*.5))];
}
function quality(it, g){
  if (g == null || isNaN(g)) return 'whiff';
  const e = Math.abs(g - it.a), b = bands(it);
  if (e === 0) return 'perfect';
  if (e <= b[0]) return 'solid';
  if (e <= b[1]) return 'ok';
  if (e <= b[2]) return 'mishit';
  if (e <= b[3]) return 'shank';
  return 'whiff';
}
/* r = yards to the hole. A perfect strike from inside 245 yards holes out. */
function planShot(r, q){
  const putt = r <= 25;
  if (q === 'whiff') return {kind: putt ? 'putt' : (r <= 60 ? 'chip' : 'full'), holed:false, r1:r};
  if (putt){
    const f = r * 3; let f1 = 0, holed = false;
    if (q === 'perfect') holed = true;
    else if (q === 'solid'){ if (f <= 20) holed = true; else f1 = 2; }
    else if (q === 'ok'){ if (f <= 12) holed = true; else f1 = Math.max(2, f * .18); }
    else if (q === 'mishit'){ if (f <= 2.5) holed = true; else f1 = Math.max(3, f * .45); }
    else f1 = Math.max(4, f * .75);
    return {kind:'putt', holed, r1: holed ? 0 : f1 / 3};
  }
  let r1, holed = false;
  if (q === 'perfect'){ if (r <= 245){ holed = true; r1 = 0; } else if (r <= 330) r1 = 1; else r1 = r - 310; }
  else if (q === 'solid') r1 = Math.max(r - Math.min(285, r * .97), 1.5 + .03 * r);
  else if (q === 'ok') r1 = Math.max(r - Math.min(250, r * .88), 4 + .07 * r);
  else if (q === 'mishit') r1 = r - Math.min(170, r * .6);
  else r1 = r - Math.min(90, r * .35);
  return {kind: r <= 60 ? 'chip' : 'full', holed, r1};
}
const DIFF_NAME = {'-3':'Albatross','-2':'Eagle','-1':'Birdie','0':'Par','1':'Bogey','2':'Double bogey','3':'Triple bogey'};
const nameFor = (strokes, par) => strokes === 1 ? 'Hole-in-one' : DIFF_NAME[clamp(strokes - par, -3, 3)];
const toPar = d => d === 0 ? 'E' : (d < 0 ? '−' + (-d) : '+' + d);
const distText = r => r <= 25 ? Math.max(1, Math.round(r * 3)) + ' ft' : Math.round(r) + ' yds';
function lieAt(x, q, r, prev){
  if (r === 0) return 'Holed';
  if (q === 'whiff' && prev) return prev;
  const [g0, g1] = C.green;
  if (x >= g0 && x <= g1) return 'Green';
  if ((x >= g0 - 6 && x < g0) || (x > g1 && x <= g1 + 6)) return 'Fringe';
  if (C.bunkers.some(b => x >= b[0] && x <= b[1])) return 'Bunker';
  if (q === 'shank') return 'Trees';
  if (q === 'mishit') return 'Rough';
  const s = C.surf.find(s => x >= s[0] && x < s[1]);
  return s && s[2] === 'fw' ? 'Fairway' : 'Rough';
}
const LIE_PHRASE = {Fairway:'in the fairway', Rough:'in the rough', Bunker:'in the bunker', Trees:'behind the trees', Fringe:'on the fringe', Green:'on the green', Tee:'on the tee'};
/* Like real golf: medium off the tee and from the fairway, harder after a bad swing or from
   trouble, easier around the green. */
function tierFor(hs){
  if (!hs.shots.length) return {T:'M', why:'off the tee'};
  const last = hs.shots[hs.shots.length - 1];
  const badShot = ['mishit','shank','whiff'].includes(last.quality);
  const badLie = ['Rough','Bunker','Trees'].includes(hs.lie);
  const near = hs.r <= 40;
  const lvl = clamp((near ? 0 : 1) + (badShot || badLie ? 1 : 0), 0, 2);
  const why = badLie ? {Rough:'from the rough', Bunker:'from the bunker', Trees:'from behind the trees'}[hs.lie]
    : badShot ? 'after a ' + QNAME[last.quality].toLowerCase()
    : hs.lie === 'Green' ? 'on the green' : near ? 'near the green' : 'from the fairway';
  return {T: ['E','M','H'][lvl], why};
}

/* =========================================================
   Settings, saved data and the question content
   ========================================================= */
const CFG = Object.assign({siteName:'RANGA-SWANG', siteUrl:'', launch:'2026-10-27', supabaseUrl:'', supabaseKey:'', github:{}}, window.RS_CONFIG || {});
const SITE = (CFG.siteUrl || (location.origin + location.pathname.replace(/[^/]*$/, ''))).replace(/\/$/, '');
const SITE_SHORT = SITE.replace(/^https?:\/\//, '');
const KEY = 'rangaswang.site.v1';
const save = Object.assign({rounds:{}, seen:[], muted:false, bonusRound:null, bonusCount:0, name:'', device:''}, store.get(KEY, {}));
if (!save.device){
  save.device = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
const persist = () => store.set(KEY, save);
persist();
const seenSet = new Set(save.seen);
function markSeen(it){ if (!seenSet.has(it.id)){ seenSet.add(it.id); save.seen.push(it.id); persist(); } }

function dkey(d){ return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function addDays(key, n){ const [y, m, d] = key.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function dnum(key){
  const [y, m, d] = key.split('-').map(Number), [a, b, c] = CFG.launch.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(a, b - 1, c)) / 864e5) + 1;
}

const CATS = {H:{name:'History', emo:'📜'}, P:{name:'Pop culture', emo:'🎬'}, N:{name:'In the news', emo:'🗞️'}, G:{name:'Geography', emo:'🌎'}, S:{name:'Sports', emo:'🏅'}};
const TIER_NAME = {E:'Easy', M:'Medium', H:'Hard'};
const CAT_KEY = {history:'H', pop:'P', geo:'G', sports:'S', news:'N'};
const PACKS = {};                    // 'YYYY-MM-DD' -> {news, E, M, H}, or null when that day has no file
let RESERVE = {E:[], M:[], H:[]};
const VAULT = [];                    // past days that exist, newest first (for bonus holes)
const okItem = q => q && q.id && q.q && Number.isFinite(Number(q.a));
const toItem = (q, tier) => ({id:String(q.id), cat:CAT_KEY[q.cat] || 'P', tier, q:String(q.q), a:Math.round(Number(q.a)),
  t:q.type === 'year' ? 'y' : 'n', u:String(q.unit || ''), f:String(q.fact || '')});
const tierList = (arr, tier) => (Array.isArray(arr) ? arr : []).filter(okItem).map(q => toItem(q, tier));
async function getJSON(path){
  try { const r = await fetch(path, {cache:'no-cache'}); return r.ok ? await r.json() : null; } catch(e){ return null; }
}
async function loadDay(key){
  if (key in PACKS) return PACKS[key];
  const raw = await getJSON(`content/days/${key}.json`);
  PACKS[key] = raw ? {news:tierList(raw.news, 'M'), E:tierList(raw.easy, 'E'), M:tierList(raw.medium, 'M'), H:tierList(raw.hard, 'H')} : null;
  return PACKS[key];
}
async function loadReserve(){
  const raw = await getJSON('content/reserve.json');
  if (raw) RESERVE = {E:tierList(raw.easy, 'E'), M:tierList(raw.medium, 'M'), H:tierList(raw.hard, 'H')};
}
async function loadVault(today){
  if (VAULT.length) return;
  const keys = [];
  for (let i = 1; i <= 30; i++){ const k = addDays(today, -i); if (dnum(k) < 1) break; keys.push(k); }
  await Promise.all(keys.map(loadDay));
  keys.forEach(k => { if (PACKS[k]) VAULT.push(k); });
}

/* Live stats (Supabase). Everything here fails quietly: the game never waits on it. */
const STATS = {
  on: !!(CFG.supabaseUrl && CFG.supabaseKey),
  async rpc(fn, body){
    if (!this.on) return null;
    const h = {'Content-Type':'application/json', apikey:CFG.supabaseKey};
    if (!/^sb_/.test(CFG.supabaseKey)) h.Authorization = 'Bearer ' + CFG.supabaseKey;
    try {
      const r = await fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, {method:'POST', headers:h, body:JSON.stringify(body)});
      if (!r.ok) return null;
      const t = await r.text();
      return t ? JSON.parse(t) : null;
    } catch(e){ return null; }
  }
};
const MIN_FIELD = 5;                 // show "how everyone did" once this many people have answered


/* =========================================================
   Canvas scene
   ========================================================= */
const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
let W = 800, H = 500, DPR = 1, groundY = 300, groundTarget = 300, charPx = 120;
let charOverride = 0;                 // poster/icon renders draw Rusty larger than the game does
const T = {};
const TOK = ['sky-top','sky-bot','sun','sun-y','cloud','hill','treeline','tree','tree-2','trunk','fairway','fairway-2','rough','green','fringe','tee','soil','soil-2','sand','cup','flag','tracer','ink','paper'];
function readTokens(){ const cs = getComputedStyle(document.documentElement); TOK.forEach(k => T[k] = cs.getPropertyValue('--' + k).trim()); }
readTokens();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
new MutationObserver(readTokens).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme','class','style']});

function resize(){
  const r = stage.getBoundingClientRect();
  W = Math.max(280, r.width); H = Math.max(260, r.height); DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  measureDock();
}
function measureDock(){
  const vis = [...$('#dock').children].find(el => !el.hidden);
  if (!vis) return;                                   // keep the ground where it is while the dock is empty
  const h = vis.offsetHeight;
  const sheet = vis && vis.classList.contains('sheet');
  groundTarget = clamp(H - h - (sheet ? 22 : 26), Math.min(150, H * .45), H * .74);
}
new ResizeObserver(resize).observe(stage);
new ResizeObserver(measureDock).observe($('#dock'));
[...$('#dock').children].forEach(el => new ResizeObserver(measureDock).observe(el));

/* camera: x (yards), ppy (pixels per yard), anchor (where cam.x sits across the screen) */
const cam = {x:0, ppy:8, anchor:.27}, camT = {x:0, ppy:8, anchor:.27};
let camRate = 3;
const sx = x => W * cam.anchor + (x - cam.x) * cam.ppy;
const hs = () => (groundY - 56) / 38;                    // pixels per yard of height
function restFrame(x, r, dir){
  const span = r <= 60 ? clamp(r * 1.7 + 16, 20, 100) : 100;
  camT.x = x; camT.ppy = W / span; camT.anchor = dir > 0 ? .27 : .73; camRate = 2.6;
}
function gyAt(x){
  let y = groundY;
  for (const b of C.bunkers) if (x > b[0] && x < b[1]) y += bunkerDepth() * Math.sin(Math.PI * (x - b[0]) / (b[1] - b[0]));
  if (x >= -12 && x <= 10) y -= 3;
  return y;
}
const bunkerDepth = () => clamp(charPx * .09, 7, 14);

/* golf ball + golfer state */
const ball = {x:0, h:0, cup:0, onTee:true, vis:true};
const golfer = {x:0, dir:1, anim:'idle', t0:0, putt:false, q:null, walkFrom:0, walkDur:900, face:'focus', timeout:false};

/* trees behind the hole, fixed for everyone */

function drawGround(now){

  const band = clamp(charPx * .085, 7, 13);

        const e = Math.min(b, s + st);

        ctx.fillRect(sx(s), groundY, sx(e) - sx(s) + .6, band);

function golferPose(now){

  const breathe = Math.sin(now / 650) * 1.1;

}

   Ball flight
   ========================================================= */
const SHAPE_K = (() => { let m = 0; for (let u = 0; u <= 1; u += .01){ const v = .5 * 4 * u * (1 - u) + .5 * 6.75 * u * u * (1 - u); if (v > m) m = v; } return m; })();

    t = d;
  } else {
    let [cf, apex] = {perfect:[.86,36], solid:[.85,33], ok:[.8,25], mishit:[.55,6], shank:[.68,10]}[q];
    if (kind === 'chip'){ apex = {perfect:9, solid:8, ok:7, mishit:2.5, shank:4}[q]; cf = q === 'mishit' ? .4 : .62; }
    if (holed) cf = Math.min(.95, cf + .06);

      const rd = (.5 + Math.sqrt(Math.abs(x1 - xh) / 25) * .7) * sp;
      segs.push({t0:t, t1:t + rd, f:u => ({x: lerp(xh, x1, holed ? 1 - Math.pow(1 - u, 1.7) : easeOut(u)), h:0})}); t += rd;

}
function stepShot(now){

    S.impacted = true; S.tImpact = now; S.onImpact();
  }
  if (!S.impacted) return;

}

const MODE = location.hash.slice(1);
const state = {day: dkey(new Date()), no: 1, round:null, phase:'intro', cur:null, timer:null, deadline:0, board:undefined, ready:false};
state.no = dnum(state.day);
const qcard = $('#qcard'), cast = $('#cast'), intro = $('#intro'), finalEl = $('#final');
const ansIn = $('#ans'), swingBtn = $('#swingBtn');
const hole = () => state.round.holes[state.round.h];

function drawHud(){

function newRound(bonus){
  const course = bonus ? [(bonus - 1) % 3] : [0, 1, 2];
  return {day: state.day, no: state.no, bonus: bonus || 0, course, h: 0, pending: null, pendingWhy: null, done: false,
    holes: course.map(ci => ({par: COURSE[ci].par, len: COURSE[ci].len, shots: [], r: COURSE[ci].len, x: 0, dir: 1, lie: 'Tee', done: false, holed: false}))};
}
function saveRound(){
  const R = state.round; if (!R) return;

}
const roundToPar = R => R.holes.reduce((a, h) => a + (h.done ? h.shots.length - h.par : 0), 0);

/* The next question. Daily rounds use today's file: its news questions on the first two tee shots, then its
   easy/medium/hard lists in order. Everyone in the same spot gets the same question. Bonus holes use what's
   left over from past days. The reserve covers any gap. Nothing a player has seen ever comes back. */

function drawQuestion(R, T){
  const hs = R.holes[R.h], order = TIER_ORDER[T];
  if (!R.bonus){
    const P = PACKS[R.day];
    if (P){
      if (!hs.shots.length && R.h < 2){ const n = P.news[R.h]; if (n && !seenSet.has(n.id)) return n; }
      for (const t of order){ const it = fresh(P[t]); if (it) return it; }
    }
  } else {
    for (const t of order) for (const k of VAULT){ const it = fresh(PACKS[k][t]); if (it) return it; }
    for (const k of VAULT){ const it = fresh(PACKS[k].news); if (it) return it; }
  }
  for (const t of order){ const it = fresh(RESERVE[t]); if (it) return it; }
  if (R.bonus && PACKS[state.day] && save.rounds[state.day] && save.rounds[state.day].done){
    for (const t of order){ const it = fresh(PACKS[state.day][t]); if (it) return it; }
  }
  return null;
}
function unseenForBonus(){
  let n = 0;
  const add = list => (list || []).forEach(it => { if (!seenSet.has(it.id)) n++; });
  VAULT.forEach(k => { const P = PACKS[k]; add(P.news); add(P.E); add(P.M); add(P.H); });
  add(RESERVE.E); add(RESERVE.M); add(RESERVE.H);
  return n;
}

function placeScene(){
  const R = state.round, hs = R ? hole() : null;
  C = COURSE[R ? R.course[R.h] : 0];

  ball.x = x; ball.h = 0; ball.cup = holed ? 1 : 0; ball.vis = true;
  ball.onTee = !hs || hs.shots.every(s => s.quality === 'whiff');
  golfer.x = holed ? C.pin - dir * 4 : x; golfer.dir = dir; golfer.putt = !holed && r <= 25; golfer.anim = 'idle'; golfer.face = 'focus';
  restFrame(golfer.x, holed ? 8 : r, dir);
  cam.x = camT.x; cam.ppy = camT.ppy; cam.anchor = camT.anchor;

}

  let h = `<span class="green" style="left:${pct(C.green[0])}%;width:${pct(C.green[1]) - pct(C.green[0])}%"></span><span class="mk tee" style="left:0%"></span><span class="mk pin" style="left:${pct(C.pin)}%"></span>`;
  if (R) hole().shots.forEach((s, i) => { if (s.quality === 'whiff' || s.holed) return; h += `<span class="mk dot q-${s.quality}" style="left:${pct(s.x1)}%"><span>${i + 1}</span></span>`; });

/* ---------- question ---------- */
function showQuestion(){

  const tf = tierFor(hs);
  let it = R.pending;
  if (!it){
    it = drawQuestion(R, tf.T);

    R.pending = it; R.pendingWhy = tf.why; markSeen(it); saveRound();
  }
  state.cur = it; state.phase = 'aim';
  golfer.putt = hs.r <= 25; golfer.anim = 'idle'; golfer.face = 'focus';
  $('#qCat').textContent = `${CATS[it.cat].emo} ${CATS[it.cat].name}`;
  const diff = $('#qDiff'); diff.textContent = TIER_NAME[it.tier]; diff.className = 'diffp d-' + it.tier;
  $('#qWhy').textContent = R.pendingWhy || tf.why;
  const nxt = hs.r <= 245 ? ` · for <b>${nameFor(n + 1, hs.par).toLowerCase()}</b>` : '';

function startTimer(){

function fmt(it, v){ if (v == null) return '—'; return it.t === 'y' ? String(v) : Number(v).toLocaleString('en-US'); }
function resultLine(hs, sh){

  const nxt = nameFor(n + 1, hs.par).toLowerCase();

  if (sh.r1 <= 25) return `Leaves ${distText(sh.r1)} ${LIE_PHRASE[sh.lie] || ''} for ${nxt}.`.replace('  ', ' ');

const QORDER = ['perfect', 'solid', 'ok', 'mishit', 'shank', 'whiff'];
function renderField(s, sh, token){

/* ---------- the shot ---------- */
function takeShot(guess, timedOut){
  if (state.phase !== 'aim') return;
  stopTimer(); state.phase = 'swing';
  ansIn.blur();
  const R = state.round, hs = hole(), it = state.cur;
  const q = quality(it, guess);
  const r0 = hs.r, x0 = hs.x, dir = hs.dir;
  const plan = planShot(r0, q);
  const strokes = hs.shots.length + 1;
  let side = 1;
  if (!plan.holed && q !== 'whiff' && plan.r1 <= 25){
    const roll = mulberry32(Math.abs(R.no) * 101 + R.h * 37 + strokes * 13 + (R.bonus || 0) * 977)();
    side = roll < (plan.kind === 'putt' ? .5 : .35) ? -1 : 1;
  }
  const r1 = plan.holed ? 0 : plan.r1;
  const x1 = q === 'whiff' ? x0 : C.pin - dir * side * r1;
  const lie = lieAt(x1, q, r1, hs.lie);
  const sh = {it, cat: it.cat, tier: it.tier, guess, timeout: !!timedOut, quality: q, kind: plan.kind, r0, r1, x0, x1, holed: plan.holed, lie};
  hs.shots.push(sh);
  hs.r = r1; hs.x = x1; hs.lie = lie; hs.holed = plan.holed;
  if (!plan.holed && q !== 'whiff') hs.dir = x1 < C.pin ? 1 : -1;
  hs.done = plan.holed || hs.shots.length >= hs.par + 3;
  R.pending = null; R.pendingWhy = null;
  if (hs.done && R.h === R.holes.length - 1) R.done = true;
  saveRound();

  // Tell the field, then ask how everyone else did on this question.
  const fieldP = STATS.on
    ? STATS.rpc('record_shot', {p_day: R.day, p_device: save.device, p_qid: it.id, p_tier: it.tier, p_quality: q,
        p_hole: R.course[R.h] + 1, p_shot: strokes, p_bonus: !!R.bonus})
        .then(() => STATS.rpc('question_stats', {p_qids: [it.id]}))
    : null;

  golfer.anim = 'swing'; golfer.t0 = performance.now(); golfer.putt = plan.kind === 'putt'; golfer.q = q;
  golfer.face = {perfect:'happy', solid:'happy', ok:'calm', mishit:'sad', shank:'wince', whiff:'sad'}[q];
  tracer = []; tracerFade = 1;
  const path = buildPath(x0, x1, plan.kind, q, plan.holed);
  shotAnim = {t0: golfer.t0, putt: golfer.putt, path, q, kind: plan.kind, x0, impacted:false, rested:false,
    onImpact(){
      if (q === 'whiff') sfx('whoosh'); else sfx(plan.kind === 'putt' ? 'putt' : 'hit', q);
      if (q !== 'whiff') ball.onTee = false;
      state.phase = 'flight';
      if (plan.kind !== 'putt' && q !== 'whiff'){
        const travel = Math.abs(x1 - x0);
        camT.ppy = W / clamp(travel * .95, 50, 230); camT.anchor = dir > 0 ? .42 : .58; camRate = 4;
      }
      const token = showCall(R, hs, sh, it);
      if (fieldP) fieldP.then(s => renderField(s && s[it.id], sh, token));
    },
    onRest(){
      state.phase = 'rest';
      hud = plan.kind !== 'putt' && q !== 'whiff' ? `TOTAL ${Math.round(Math.abs(x1 - x0))} YDS` + (hs.r > 25 ? ` · ${Math.round(hs.r)} TO PIN` : '') : null;
      if (plan.holed){
        camT.x = C.pin; camT.anchor = .5; camT.ppy = W / 34; camRate = 2.4;
        golfer.x = C.pin - hs.dir * 4; golfer.dir = hs.dir;
        golfer.anim = hs.shots.length <= hs.par ? 'celebrate' : 'shrug';
      } else {
        camT.x = x1; camT.anchor = .5; camRate = 2.4;
        if (hs.done){ golfer.x = x1; golfer.anim = 'sulk'; golfer.dir = hs.dir; }
      }
      $('#cRes').textContent = resultLine(hs, sh);
      const nb = $('#nextBtn');
      nb.textContent = R.done ? 'See your scorecard'
        : hs.done ? `To the ${ordinal(R.h + 2)} tee`
        : (sh.r1 <= 25 && sh.quality !== 'whiff' ? 'Line up the putt' : 'Walk to the ball');
      nb.hidden = false;
      setTimeout(() => { try { nb.focus({preventScroll:true}); } catch(e){} }, 30);
      paintTrack();
    }};
}

function walkTo(cb){
  const hs = hole();

function stats(){
  const done = Object.values(save.rounds).filter(r => r && r.done && r.holes && !r.short);
  const tops = done.map(r => roundToPar(r));
  const holes = done.flatMap(r => r.holes);
  const buckets = ['Eagle or better','Birdie','Par','Bogey','Double bogey','Triple bogey'];
  const dist = Object.fromEntries(buckets.map(b => [b, 0]));
  holes.forEach(h => { const d = h.shots.length - h.par; dist[buckets[clamp(d + 2, 0, 5)]]++; });
  const played = new Set(done.map(r => r.day));
  let streak = 0, k = played.has(state.day) ? state.day : addDays(state.day, -1);
  while (played.has(k)){ streak++; k = addDays(k, -1); }
  const avg = tops.length ? tops.reduce((a, b) => a + b, 0) / tops.length : 0;
  const perfects = holes.reduce((a, h) => a + h.shots.filter(s => s.quality === 'perfect').length, 0);
  const aces = holes.filter(h => h.holed && h.shots.length === 1).length;
  return {rounds: done.length, avg, best: tops.length ? Math.min(...tops) : null, streak, perfects, aces, dist};
}

  $('#bonusBtn').addEventListener('click', startBonus);
  const back = $('#backBtn');
  if (back) back.addEventListener('click', () => { state.round = save.rounds[state.day]; showFinalScene(); });
  renderBoard();
  tickCountdown();
}

/* ---------- today's field and leaderboard ---------- */
async function submitRound(){
  const R = state.round;
  if (!STATS.on || !R || R.bonus || !R.done || R.short) return null;
  const scores = R.holes.map(h => h.shots.length);
  if (scores.some(s => s < 1)) return null;
  const perf = R.holes.reduce((a, h) => a + h.shots.filter(s => s.quality === 'perfect').length, 0);
  return STATS.rpc('submit_round', {p_day: R.day, p_device: save.device, p_name: save.name || 'Rookie', p_scores: scores, p_perfects: perf});
}
async function loadBoard(){
  const R = state.round;
  if (!STATS.on || !R || R.bonus || R.short) return;
  state.board = undefined; renderBoard();
  const B = await submitRound();
  if (state.round !== R) return;
  state.board = B || false;
  renderBoard();
}
function renderBoard(){
  const el = $('#fieldSect'); if (!el) return;
  const B = state.board;
  const sc = $('#scWrap'); if (sc) sc.innerHTML = courseTable(state.round);
  if (B === undefined){ el.innerHTML = `<h3>Today's field</h3><p class="small">Checking the leaderboard…</p>`; return; }
  if (!B){ el.innerHTML = `<h3>Today's field</h3><p class="small">The leaderboard isn't reachable right now. Your round is saved on this device and will post next time you open the game.</p>`; return; }
  const me = B.me, n = B.players || 0;
  let head = `${n.toLocaleString('en-US')} players so far today.`;
  if (me){
    const ties = Math.max(0, n - 1 - me.beat - (me.rank - 1)), place = `${ties ? 'tied for ' : ''}<b>${ordinal(me.rank)}</b>`;
    const players = `${n.toLocaleString('en-US')} players`;
    if (n <= 1) head = `You're the first one on today's board.`;
    else if (me.rank === 1 && !ties) head = `You're leading all ${players} today.`;
    else if (me.beat === 0) head = `You're ${place} of ${players} today.`;
    else head = `You beat <b>${Math.round(100 * me.beat / (n - 1))}%</b> of ${players} today and sit ${place}.`;
  }
  const row = e => `<li class="${e.me ? 'me' : ''}"><span class="lr">${e.rank}</span><span class="ln">${esc(e.name)}${e.me ? ' <i>you</i>' : ''}</span><span class="ls">${e.total}</span><span class="lp ${e.to_par < 0 ? 'u' : e.to_par > 0 ? 'o' : ''}">${toPar(e.to_par)}</span></li>`;
  let list = (B.top || []).map(row).join('');
  if (me && !(B.top || []).some(e => e.me)) list += `<li class="gap" aria-hidden="true">⋯</li>` + row(Object.assign({}, me, {me:true}));
  el.innerHTML = `<h3>Today's field</h3><p class="fieldline">${head}</p><ol class="board">${list}</ol>
    <form class="nameform" id="nameForm"><label for="nameIn">Your name on the board</label>
      <div class="nrow"><input id="nameIn" maxlength="18" autocomplete="nickname" enterkeyhint="done" value="${esc(save.name || (me ? me.name : 'Rookie'))}"><button class="ghost" type="submit">Save name</button></div></form>`;
  $('#nameForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = $('#nameIn').value.replace(/[^A-Za-z0-9 ._'-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 18);
    save.name = v || 'Rookie'; persist();
    const res = await submitRound();
    if (res){ state.board = res; renderBoard(); toast('Name saved'); }
    else toast("Couldn't reach the leaderboard. Try again in a minute.");
  });
}

function showFinalScene(){
  const R = state.round;
  R.h = R.holes.length - 1; state.phase = 'done';
  placeScene(); paintTrack(); renderFinal();
  const hs = hole();
  golfer.anim = hs.holed ? (roundToPar(R) <= 0 ? 'celebrate' : 'shrug') : 'sulk';
  loadBoard();
}
async function startBonus(){
  audio();
  const btn = $('#bonusBtn'); if (btn){ btn.disabled = true; btn.textContent = 'Setting up…'; }
  await loadVault(state.day);
  if (!(save.bonusRound && !save.bonusRound.done) && unseenForBonus() < 6){
    if (btn){ btn.disabled = false; btn.textContent = 'Play a bonus hole'; }
    toast("You've played every question in the bag. More arrive with tomorrow's course.");
    return;
  }
  if (save.bonusRound && !save.bonusRound.done) state.round = save.bonusRound;
  else { save.bonusCount = (save.bonusCount || 0) + 1; state.round = newRound(save.bonusCount); }
  state.board = undefined;
  saveRound();
  placeScene(); paintTrack();
  const hs = hole();
  if (!hs.shots.length && !state.round.pending) walkTo(() => showQuestion()); else showQuestion();
}
function tickCountdown(){
  const el = $('#countdown'); if (!el) return;
  const now = new Date(), mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const m = Math.max(0, Math.round((mid - now) / 60000));
  el.textContent = `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
}
setInterval(tickCountdown, 30000);

function finish(){
  state.phase = 'done';
  state.round.done = true;
  saveRound();
  paintTrack();
  renderFinal();
  loadBoard();
}

document.addEventListener('keydown', e => {
  if (state.phase === 'rest' && (e.key === 'Enter' || e.key === ' ') && !$('#nextBtn').hidden && document.activeElement !== $('#nextBtn')){ e.preventDefault(); $('#nextBtn').click(); }
});

/* ---------- poster and icon (used to make the link preview and app icons) ---------- */
function bootPoster(){
  document.documentElement.classList.add(MODE === 'poster' ? 'mode-poster' : 'mode-icon');
  resize();
  C = COURSE[0]; showOnly(null);
  ball.vis = MODE === 'poster'; ball.x = 0; ball.onTee = true;
  golfer.x = 0; golfer.dir = 1; golfer.putt = false;
  if (MODE === 'poster'){
    golfer.anim = 'pose'; golfer.pose = {phi: 2.25, hinge: 1.7}; golfer.face = 'focus';
    groundY = groundTarget = H * .8; charOverride = H * .5;
    camT.x = cam.x = 0; camT.ppy = cam.ppy = W / 120; camT.anchor = cam.anchor = .26;
  } else {
    const k = MODE === 'iconm' ? .74 : 1;          // maskable icons keep Rusty inside the safe circle
    golfer.anim = 'pose'; golfer.pose = {phi: 0, hinge: -.18}; golfer.face = 'happy';
    groundY = groundTarget = H * (.52 + .78 * k); charOverride = H * k;
    camT.x = cam.x = 0; camT.ppy = cam.ppy = W / 60; camT.anchor = cam.anchor = .5;
  }
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
async function boot(){
  resize();
  if (MODE === 'poster' || MODE === 'icon' || MODE === 'iconm'){ bootPoster(); return; }
  const saved = save.rounds[state.day];
  state.round = saved && saved.holes ? saved : newRound(0);
  placeScene(); paintTrack(); renderIntro(false);
  measureDock();
  groundY = groundTarget; charPx = clamp(groundY * .3, 48, 170);
  requestAnimationFrame(loop);
  await Promise.all([loadDay(state.day), loadReserve()]);
  state.ready = true;
  if (state.round.done) showFinalScene();
  else renderIntro(!!(saved && saved.holes && (saved.h > 0 || saved.holes[0].shots.length || saved.pending)));
}
boot();
})();
</script>
